<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voltage Arena Esports | Neon Cyberpunk HTML Template</title>
<meta name="description" content="Free neon cyberpunk website template for an esports tournament. Glowing pink and cyan text, a grid floor, scan lines and glitch headline. One HTML file.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07040f;--pink:#ff2bd6;--cyan:#1ef6ff;--yel:#f5ff3b;--ink:#e9e4ff}
*{box-sizing:border-box;margin:0}
body{font-family:Rajdhani,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:18px;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.hero{position:relative;min-height:92vh;display:grid;place-items:start center;padding-top:9vh!important;text-align:center;padding:40px 20px;overflow:hidden}
.floor{position:absolute;left:-50%;right:-50%;bottom:-10%;height:55%;background-image:linear-gradient(var(--pink) 1px,transparent 1px),linear-gradient(90deg,var(--pink) 1px,transparent 1px);background-size:60px 60px;transform:perspective(400px) rotateX(62deg);opacity:.45;-webkit-mask:linear-gradient(transparent,#000 50%);mask:linear-gradient(transparent,#000 50%)}
.sun{position:absolute;width:300px;height:300px;border-radius:50%;bottom:30%;left:50%;transform:translateX(-50%);background:linear-gradient(var(--yel),var(--pink) 70%);-webkit-mask:repeating-linear-gradient(0deg,#000 0 18px,transparent 18px 24px);mask:repeating-linear-gradient(180deg,#000 0 60%,transparent 60% 64%,#000 64% 72%,transparent 72% 77%,#000 77% 83%,transparent 83% 89%,#000 89%);opacity:.55;filter:drop-shadow(0 0 40px var(--pink))}
.hero>div{position:relative;z-index:1}
.date{font-family:Orbitron,sans-serif;font-weight:600;color:var(--cyan);text-shadow:0 0 10px var(--cyan);letter-spacing:.2em;font-size:.95rem}
h1{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(3rem,10vw,7.5rem);line-height:.95;margin:14px 0;color:#fff;text-shadow:0 0 6px #fff,0 0 20px var(--pink),0 0 50px var(--pink);position:relative}
h1::before,h1::after{content:attr(data-t);position:absolute;inset:0;opacity:.7}
h1::before{color:var(--cyan);transform:translate(3px,-2px);clip-path:inset(0 0 60% 0);animation:gl 3s steps(1) infinite}
h1::after{color:var(--pink);transform:translate(-3px,2px);clip-path:inset(55% 0 0 0);animation:gl 2.4s steps(1) infinite reverse}
@keyframes gl{0%,90%{transform:translate(0,0)}92%{transform:translate(4px,-2px)}95%{transform:translate(-4px,2px)}}
@media(prefers-reduced-motion:reduce){h1::before,h1::after{animation:none}}
.hero p{max-width:40ch;margin:0 auto 28px;color:#e6e0ff;text-shadow:0 2px 10px #000,0 0 2px #000}
.btn{display:inline-block;font-family:Orbitron,sans-serif;font-weight:600;color:var(--cyan);text-decoration:none;padding:14px 28px;border:2px solid var(--cyan);box-shadow:0 0 12px var(--cyan),inset 0 0 12px rgba(30,246,255,.4);text-shadow:0 0 8px var(--cyan)}
.btn:hover{background:rgba(30,246,255,.12)}
a:focus-visible{outline:2px solid var(--yel);outline-offset:4px}
.teams{max-width:1080px;margin:0 auto;padding:50px 20px 70px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.tm{border:1px solid rgba(255,43,214,.5);padding:20px;background:rgba(255,43,214,.05);box-shadow:0 0 20px rgba(255,43,214,.15)}
.tm h2{font-family:Orbitron,sans-serif;font-size:1rem;color:var(--pink);text-shadow:0 0 8px var(--pink)}
.tm b{display:block;font-size:2rem;color:var(--yel);text-shadow:0 0 10px var(--yel)}
.credit{text-align:center;padding:0 0 30px;font-size:.9rem;color:#8f86b8}.credit a{color:var(--cyan)}
@media(max-width:820px){.teams{grid-template-columns:1fr 1fr}.sun{width:220px;height:220px}}
</style></head><body>
<main><section class="hero"><span class="sun" aria-hidden="true"></span><span class="floor" aria-hidden="true"></span><div><div class="date">22 TO 24 NOVEMBER, SEOUL</div><h1 data-t="VOLTAGE ARENA">VOLTAGE ARENA</h1><p>Sixteen teams, three nights, one trophy. Watch the finals live in the arena or stream every match free.</p><a class="btn" href="#">Get arena tickets</a></div></section>
<section class="teams" aria-label="Top seeded teams"><div class="tm"><h2>Seed 1</h2><b>Red Kite</b>Busan</div><div class="tm"><h2>Seed 2</h2><b>Nightjar</b>Tokyo</div><div class="tm"><h2>Seed 3</h2><b>Static Fox</b>Berlin</div><div class="tm"><h2>Seed 4</h2><b>Iron Lotus</b>Manila</div></section></main>
<p class="credit">Free template from <a href="https://mmrahmanbappi.github.io/100-css-designs/">100 CSS Designs</a></p>
</body></html>
