<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palm Mall FM | Vaporwave HTML Template</title>
<meta name="description" content="Free vaporwave website template for a synth music label. Pink and teal gradients, a retro desktop window, marble bust and checker floor in CSS. One HTML file.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=VT323&family=Monoton&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff71ce;--teal:#01cdfe;--mint:#05ffa1;--lav:#b967ff;--ink:#1a0933}
*{box-sizing:border-box;margin:0}
body{font-family:Montserrat,system-ui,sans-serif;color:#fff;min-height:100vh;background:linear-gradient(180deg,#2b0f54 0%,#ab1f8a 45%,#ff71ce 62%,#ffb3e6 100%);line-height:1.5;overflow-x:hidden}
.floor{position:fixed;left:-50%;right:-50%;bottom:0;height:40vh;background:repeating-conic-gradient(#fff 0 25%,#1a0933 0 50%) 0 0/80px 80px;transform:perspective(500px) rotateX(60deg);transform-origin:bottom;opacity:.85;z-index:-1}
.hero{text-align:center;padding:60px 20px 20px}
h1{font-family:Monoton,cursive;font-weight:400;font-size:clamp(3rem,11vw,8rem);line-height:1;color:var(--mint);text-shadow:4px 4px 0 var(--lav),8px 8px 0 var(--ink)}
.sub{font-family:VT323,monospace;font-size:1.8rem;letter-spacing:.3em;color:#fff;text-shadow:0 0 10px var(--pink)}
.row{max-width:1060px;margin:40px auto 0;padding:0 20px 60px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.win{background:#c0c0c0;color:#000;border:2px solid;border-color:#fff #404040 #404040 #fff;font-family:VT323,monospace;font-size:1.3rem;box-shadow:8px 8px 0 rgba(26,9,51,.5)}
.tb{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:4px 8px;display:flex;justify-content:space-between}
.tb span{background:#c0c0c0;color:#000;border:2px solid;border-color:#fff #404040 #404040 #fff;width:22px;text-align:center;line-height:16px}
.wb{padding:14px 16px}
.wb li{list-style:none;display:flex;justify-content:space-between;padding:4px 6px}
.wb li:hover,.wb li.on{background:#000080;color:#fff}
.play{font-family:VT323,monospace;font-size:1.3rem;margin-top:10px;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:4px 18px;cursor:pointer}
.play:active{border-color:#404040 #fff #fff #404040}
button:focus-visible,a:focus-visible{outline:2px dotted #000;outline-offset:2px}
.bust{position:relative;height:340px}
.bust .head{position:absolute;left:50%;top:10px;width:150px;height:190px;margin-left:-75px;border-radius:48% 48% 44% 44%;background:linear-gradient(135deg,#fff,#d9d4e8 60%,#b7aecf)}
.bust .neck{position:absolute;left:50%;top:180px;width:70px;height:60px;margin-left:-35px;background:linear-gradient(90deg,#d9d4e8,#fff,#cfc8e0)}
.bust .chest{position:absolute;left:50%;top:230px;width:260px;height:110px;margin-left:-130px;border-radius:120px 120px 10px 10px;background:linear-gradient(135deg,#fff,#d4cde6 60%,#aea5c8)}
.bust .shades{position:absolute;left:50%;top:80px;width:130px;height:30px;margin-left:-65px;background:linear-gradient(90deg,var(--pink),var(--teal));border-radius:6px 6px 14px 14px;box-shadow:0 0 20px var(--pink)}
.palm{position:absolute;right:0;top:0;font-family:VT323,monospace;font-size:1.4rem;color:var(--ink);background:var(--mint);padding:4px 10px;transform:rotate(8deg)}
.credit{text-align:center;padding:0 0 20px;font-size:.9rem;color:var(--ink);font-weight:700}.credit a{color:var(--ink)}
@media(max-width:820px){.row{grid-template-columns:1fr}}
</style></head><body>
<span class="floor" aria-hidden="true"></span>
<header class="hero"><h1>PALM MALL</h1><p class="sub">F M &nbsp; 9 9 . 1</p></header>
<main class="row"><section class="win" aria-label="Playlist"><div class="tb"><b>new_releases.exe</b><span aria-hidden="true">x</span></div><div class="wb"><ol id="pl"><li class="on"><span>01 Escalator Dreams</span><span>4:12</span></li><li><span>02 Food Court at 3am</span><span>3:48</span></li><li><span>03 Fountain Coins</span><span>5:01</span></li><li><span>04 Last Bus Home</span><span>4:30</span></li></ol><button class="play" id="play">Play</button></div></section>
<div class="bust" aria-hidden="true"><span class="head"></span><span class="neck"></span><span class="chest"></span><span class="shades"></span><span class="palm">NEW TAPE OUT</span></div></main>
<p class="credit">Free template from <a href="https://mmrahmanbappi.github.io/100-css-designs/">100 CSS Designs</a></p>
<script>
const li=[...document.querySelectorAll('#pl li')];li.forEach(l=>l.onclick=()=>{li.forEach(x=>x.classList.remove('on'));l.classList.add('on')});
document.getElementById('play').onclick=e=>e.target.textContent=e.target.textContent==='Play'?'Pause':'Play';
</script>
</body></html>
