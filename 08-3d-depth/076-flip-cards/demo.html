<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palabra Spanish Flashcards | 3D Flip Cards HTML Template</title>
<meta name="description" content="Free 3D flip card template for a language learning app. Click or press Enter to flip each flashcard and see the answer on the back. One HTML file.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ec;--ink:#2b2340;--muted:#6f6882;--red:#ef476f;--yel:#ffd166;--grn:#06d6a0;--blu:#118ab2}
*{box-sizing:border-box;margin:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{max-width:1000px;margin:0 auto;padding:22px 24px;display:flex;justify-content:space-between;align-items:center}
header b{font-family:Sniglet,sans-serif;font-size:1.5rem;color:var(--red)}
.prog{display:flex;align-items:center;gap:10px;font-weight:700}
.prog i{display:block;width:140px;height:10px;border-radius:10px;background:#f1e4cf;overflow:hidden}.prog i span{display:block;height:100%;width:0;background:var(--grn);transition:width .3s}
main{max-width:1000px;margin:0 auto;padding:20px 24px 60px}
h1{font-family:Sniglet,sans-serif;font-weight:800;font-size:clamp(2rem,5vw,3.2rem);line-height:1.1}
.sub{color:var(--muted);margin:8px 0 26px;font-size:1.1rem}
.deck{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;perspective:1000px}
.fc{all:unset;cursor:pointer;display:block;aspect-ratio:4/3;position:relative}
.fc:focus-visible .in{outline:4px solid var(--ink);outline-offset:4px}
.in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.3,.6,1);border-radius:22px}
.fc[aria-pressed=true] .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:16px;box-shadow:0 12px 24px rgba(43,35,64,.12)}
.front{background:#fff;border:3px solid var(--c)}
.front b{font-family:Sniglet,sans-serif;font-size:2.2rem;color:var(--c)}
.front small{color:var(--muted)}
.back{background:var(--c);color:#fff;transform:rotateY(180deg)}
.back b{font-size:1.6rem}
.back small{opacity:.9}
@media(prefers-reduced-motion:reduce){.in{transition:none}}
.credit{text-align:center;padding:0 0 30px;color:var(--muted);font-size:.9rem}.credit a{color:var(--ink)}
@media(max-width:760px){.deck{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><b>Palabra</b><span class="prog"><span id="cnt">0 of 6</span><i><span id="bar"></span></i></span></header>
<main><h1>Lesson 4: At the market</h1><p class="sub">Say the word out loud, then tap the card to check.</p>
<section class="deck" id="deck"></section></main>
<p class="credit">Free template from <a href="https://mmrahmanbappi.github.io/100-css-designs/">100 CSS Designs</a></p>
<script>
const W=[['la manzana','the apple','Una manzana roja, por favor.','--red'],['el pan','the bread','El pan está caliente.','--yel'],['barato','cheap','¡Qué barato!','--grn'],['¿Cuánto cuesta?','How much is it?','¿Cuánto cuesta el queso?','--blu'],['el pescado','the fish','El pescado es fresco.','--blu'],['la bolsa','the bag','¿Necesita una bolsa?','--red']];
const d=document.getElementById('deck'),seen=new Set();
W.forEach((w,i)=>{const b=document.createElement('button');b.className='fc';b.setAttribute('aria-pressed','false');b.style.setProperty('--c','var('+w[3]+')');b.setAttribute('aria-label',w[0]+', tap to show the meaning');
b.innerHTML='<span class="in"><span class="face front"><b lang="es">'+w[0]+'</b><small>Tap to flip</small></span><span class="face back" aria-live="polite"><b>'+w[1]+'</b><small lang="es">'+w[2]+'</small></span></span>';
b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);if(on){seen.add(i);document.getElementById('cnt').textContent=seen.size+' of 6';document.getElementById('bar').style.width=seen.size/6*100+'%'}};d.appendChild(b)});
</script>
</body></html>
