<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streak Habit Tracker | Micro Interactions HTML Template</title>
<meta name="description" content="Free micro interactions template for a habit tracker. Animated checkboxes, like button, switch, copy feedback and counter bump in pure CSS. One HTML file.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ff;--card:#fff;--ink:#1e1b3a;--muted:#6b678a;--acc:#6d4aff;--ok:#16a34a;--heart:#f43f5e}
*{box-sizing:border-box;margin:0}
body{font-family:Lexend,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
main{max-width:980px;margin:0 auto;padding:50px 24px}
h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.1;letter-spacing:-.02em}
.sub{color:var(--muted);margin:10px 0 30px;font-size:1.1rem}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}
.card{background:var(--card);border-radius:22px;padding:24px;box-shadow:0 10px 30px rgba(60,40,140,.06)}
.card h2{font-size:1rem;color:var(--muted);font-weight:600;margin-bottom:14px}
.hab{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid #efedf9;cursor:pointer}
.hab:first-of-type{border:0}
.hab input{position:absolute;opacity:0}
.box{width:28px;height:28px;border-radius:9px;border:2px solid #c9c4ea;display:grid;place-items:center;transition:background .2s,border-color .2s,transform .2s}
.box svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .25s .05s}
.hab input:checked+.box{background:var(--ok);border-color:var(--ok);transform:scale(1.08)}
.hab input:checked+.box svg{stroke-dashoffset:0}
.hab input:focus-visible+.box{outline:3px solid var(--acc);outline-offset:3px}
.hab .t{flex:1;transition:color .2s}
.hab input:checked~.t{color:var(--muted);text-decoration:line-through}
.hab small{color:var(--muted)}
.count{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.count b{font-size:2.8rem;display:inline-block}
.count b.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.25);color:var(--acc)}}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid #efedf9}
.row:first-of-type{border:0}
.like{font:inherit;display:flex;align-items:center;gap:8px;background:#fff0f3;color:var(--heart);border:0;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600}
.like svg{width:20px;height:20px;fill:none;stroke:var(--heart);stroke-width:2;transition:transform .2s}
.like[aria-pressed=true] svg{fill:var(--heart);animation:pop .4s}
@keyframes pop{40%{transform:scale(1.4)}}
.sw{width:52px;height:30px;border-radius:30px;border:0;background:#d8d4ee;position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.5,.6,1)}
.sw[aria-checked=true]{background:var(--acc)}.sw[aria-checked=true]::after{transform:translateX(22px)}
.copy{font:inherit;font-weight:600;border:1px solid #dcd8f2;background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;min-width:112px;color:var(--ink);transition:background .2s,color .2s}
.copy.done{background:var(--ok);color:#fff;border-color:var(--ok)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
.credit{text-align:center;padding:10px 0 30px;color:var(--muted);font-size:.9rem}.credit a{color:var(--ink)}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
</style></head><body>
<main><h1>Small habits, done daily</h1><p class="sub">Tick off today's habits. Every tap gives a little feedback so it feels good to keep going.</p>
<div class="grid"><section class="card"><h2>Today</h2>
<label class="hab"><input type="checkbox"><span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5"/></svg></span><span class="t">Drink 2 litres of water<br><small>Health</small></span></label><label class="hab"><input type="checkbox"><span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5"/></svg></span><span class="t">Read 10 pages<br><small>Mind</small></span></label><label class="hab"><input type="checkbox"><span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5"/></svg></span><span class="t">Walk 8,000 steps<br><small>Health</small></span></label><label class="hab"><input type="checkbox"><span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5"/></svg></span><span class="t">No phone after 10pm<br><small>Sleep</small></span></label>
<div class="count"><b id="n">0</b><span>of 4 done today</span></div></section>
<section class="card"><h2>Settings</h2>
<div class="row"><span>Daily reminder at 8am</span><button class="sw" role="switch" aria-checked="true" aria-label="Daily reminder"></button></div>
<div class="row"><span>Share streak with friends</span><button class="sw" role="switch" aria-checked="false" aria-label="Share streak"></button></div>
<div class="row"><span>Cheer from Maya</span><button class="like" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6C19 16.5 12 21 12 21z"/></svg><span>12</span></button></div>
<div class="row"><span>Invite link</span><button class="copy" id="copy">Copy link</button></div></section></div></main>
<p class="credit">Free template from <a href="https://mmrahmanbappi.github.io/100-css-designs/">100 CSS Designs</a></p>
<script>
const n=document.getElementById('n');document.querySelectorAll('.hab input').forEach(c=>c.onchange=()=>{n.textContent=document.querySelectorAll('.hab input:checked').length;n.classList.remove('bump');void n.offsetWidth;n.classList.add('bump')});
document.querySelectorAll('.sw').forEach(s=>s.onclick=()=>s.setAttribute('aria-checked',s.getAttribute('aria-checked')!=='true'));
document.querySelector('.like').onclick=e=>{const b=e.currentTarget,on=b.getAttribute('aria-pressed')!=='true',sp=b.querySelector('span');b.setAttribute('aria-pressed',on);sp.textContent=+sp.textContent+(on?1:-1)};
document.getElementById('copy').onclick=e=>{const b=e.currentTarget;navigator.clipboard?.writeText(location.href);b.textContent='Copied';b.classList.add('done');setTimeout(()=>{b.textContent='Copy link';b.classList.remove('done')},1600)};
</script>
</body></html>
