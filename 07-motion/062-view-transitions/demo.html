<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fork and Field Recipes | View Transitions API HTML Template</title>
<meta name="description" content="Free View Transitions API template for a recipe site. Click a recipe card and it morphs smoothly into a full detail view. One HTML file.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--ink:#23201b;--muted:#6f685d;--card:#fff}
*{box-sizing:border-box;margin:0}
body{font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{max-width:1100px;margin:0 auto;padding:22px 24px}
header b{font-family:Fraunces,serif;font-size:1.5rem}
main{max-width:1100px;margin:0 auto;padding:0 24px 60px}
h1{font-family:Fraunces,serif;font-size:clamp(2rem,4.5vw,3rem);margin:10px 0 20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{all:unset;cursor:pointer;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(60,40,10,.08);display:block}
.card:focus-visible,.back:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.pic{height:190px;background:var(--g)}
.card h2{font-family:Fraunces,serif;font-size:1.3rem;padding:14px 18px 0}
.card p{padding:2px 18px 18px;color:var(--muted)}
.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:34px;background:var(--card);border-radius:24px;overflow:hidden}
.detail .pic{height:100%;min-height:420px;border-radius:0}
.detail .txt{padding:34px 34px 34px 0}
.detail h2{font-family:Fraunces,serif;font-size:2.4rem;line-height:1.1}
.detail ul,.detail ol{padding-left:20px;margin:10px 0 18px}
.back{font:inherit;font-weight:600;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;margin-bottom:18px}
[hidden]{display:none!important}
::view-transition-group(*){animation-duration:.45s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
.credit{text-align:center;padding:0 0 30px;color:var(--muted);font-size:.9rem}.credit a{color:var(--ink)}
@media(max-width:820px){.grid{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.detail .pic{min-height:220px}.detail .txt{padding:0 24px 24px}}
</style></head><body>
<header><b>Fork and Field</b></header>
<main><h1 id="h">Quick dinners for busy weeknights</h1>
<div class="grid" id="grid"></div>
<article class="detail" id="detail" hidden><div class="pic" id="dpic"></div><div class="txt"><button class="back" id="back">Back to recipes</button><h2 id="dt"></h2><p id="dm"></p><h3>You need</h3><ul id="di"></ul><h3>Method</h3><ol id="ds"></ol></div></article></main>
<p class="credit">Free template from <a href="https://mmrahmanbappi.github.io/100-css-designs/">100 CSS Designs</a></p>
<script>
const R=[
{t:'Lemon garlic pasta',m:'20 minutes, serves 2',g:'radial-gradient(circle at 60% 40%,#fff3b0 0 18%,transparent 19%),linear-gradient(135deg,#f6d365,#fda085)',i:['200g spaghetti','2 lemons','3 garlic cloves','Parmesan'],s:['Cook the pasta.','Fry garlic in olive oil for one minute.','Toss with pasta, lemon juice, zest and cheese.']},
{t:'Crispy tofu rice bowl',m:'25 minutes, serves 2',g:'radial-gradient(circle at 40% 55%,#fff 0 14%,transparent 15%),linear-gradient(135deg,#84fab0,#8fd3f4)',i:['400g firm tofu','Rice','Soy sauce','Spring onions'],s:['Press and cube the tofu.','Fry until golden on all sides.','Serve on rice with soy and spring onions.']},
{t:'Tomato and bean stew',m:'30 minutes, serves 4',g:'radial-gradient(circle at 50% 50%,#ffb199 0 20%,transparent 21%),linear-gradient(135deg,#ff0844,#ffb199)',i:['2 tins tomatoes','1 tin butter beans','1 onion','Smoked paprika'],s:['Soften the onion.','Add paprika, tomatoes and beans.','Simmer 20 minutes and serve with bread.']}];
const grid=document.getElementById('grid'),det=document.getElementById('detail'),h=document.getElementById('h');let last=null;
R.forEach((r,k)=>{const b=document.createElement('button');b.className='card';b.innerHTML='<div class="pic" style="--g:'+r.g+'"></div><h2>'+r.t+'</h2><p>'+r.m+'</p>';b.onclick=()=>open(k,b);grid.appendChild(b)});
function vt(fn){document.startViewTransition?document.startViewTransition(fn):fn()}
function open(k,b){last=b;const r=R[k];b.querySelector('.pic').style.viewTransitionName='hero';b.querySelector('h2').style.viewTransitionName='title';
vt(()=>{b.querySelector('.pic').style.viewTransitionName='';b.querySelector('h2').style.viewTransitionName='';
const p=document.getElementById('dpic');p.style.background=r.g;p.style.viewTransitionName='hero';const t=document.getElementById('dt');t.textContent=r.t;t.style.viewTransitionName='title';
document.getElementById('dm').textContent=r.m;document.getElementById('di').innerHTML=r.i.map(x=>'<li>'+x+'</li>').join('');document.getElementById('ds').innerHTML=r.s.map(x=>'<li>'+x+'</li>').join('');
grid.hidden=true;h.hidden=true;det.hidden=false});setTimeout(()=>document.getElementById('back').focus(),500)}
document.getElementById('back').onclick=()=>{vt(()=>{det.hidden=true;grid.hidden=false;h.hidden=false;document.getElementById('dpic').style.viewTransitionName='';document.getElementById('dt').style.viewTransitionName='';
if(last){last.querySelector('.pic').style.viewTransitionName='hero';last.querySelector('h2').style.viewTransitionName='title'}});
setTimeout(()=>{if(last){last.querySelector('.pic').style.viewTransitionName='';last.querySelector('h2').style.viewTransitionName='';last.focus()}},600)};
</script>
</body></html>
