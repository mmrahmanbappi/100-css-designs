<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Compass College Finder | Directory Listing HTML Template</title>
<meta name="description" content="Free directory listing template for a college finder. Live search, filters by city, subject and fees, sort, result count and listing cards. One HTML file.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#17202b;--muted:#5d6878;--line:#e2e6ec;--acc:#e0621f;--acc2:#fff1e8;--ok:#16835a}
*{box-sizing:border-box;margin:0}
body{font-family:"Public Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.head{background:var(--ink);color:#fff}
.head .in{max-width:1180px;margin:0 auto;padding:18px 24px 50px}
.head nav{display:flex;justify-content:space-between;margin-bottom:30px}
.head nav a{color:#fff}
h1{font-size:clamp(1.9rem,4.5vw,3rem);line-height:1.1;letter-spacing:-.02em;max-width:22ch}
.head p{color:#b8c2cf;margin-top:8px}
.search{max-width:1180px;margin:-28px auto 0;padding:0 24px}
.search div{display:flex;background:#fff;border-radius:14px;box-shadow:0 12px 30px rgba(23,32,43,.12);padding:6px}
.search input{flex:1;font:inherit;font-size:1.05rem;border:0;padding:12px 14px;min-width:0}
.search input:focus{outline:none}
.search div:focus-within{box-shadow:0 0 0 3px var(--acc),0 12px 30px rgba(23,32,43,.12)}
.layout{max-width:1180px;margin:0 auto;padding:30px 24px 60px;display:grid;grid-template-columns:240px 1fr;gap:28px}
aside{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;align-self:start;position:sticky;top:16px}
aside h2{font-size:.95rem;margin:14px 0 8px}
aside h2:first-child{margin-top:0}
aside label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:.95rem;cursor:pointer}
aside input[type=checkbox]{accent-color:var(--acc);width:17px;height:17px}
aside input[type=range]{width:100%;accent-color:var(--acc)}
.reset{font:inherit;font-size:.9rem;color:var(--acc);background:none;border:0;padding:0;margin-top:14px;cursor:pointer;text-decoration:underline}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.top p{color:var(--muted)}
select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.card{display:grid;grid-template-columns:88px 1fr auto;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;align-items:start}
.logo{width:88px;height:88px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.5rem}
.card h3{font-size:1.1rem}
.card .loc{color:var(--muted);font-size:.92rem}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tags span{background:var(--bg);border-radius:6px;padding:2px 8px;font-size:.82rem}
.tags .open{background:#e5f5ee;color:var(--ok);font-weight:600}
.side{text-align:right;min-width:130px}
.side b{display:block;font-size:1.15rem}
.side small{color:var(--muted)}
.side a{display:inline-block;margin-top:10px;background:var(--acc2);color:var(--acc);font-weight:600;text-decoration:none;padding:8px 14px;border-radius:8px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--muted)}
.credit{text-align:center;padding:0 0 30px;color:var(--muted);font-size:.9rem}.credit a{color:var(--ink)}
@media(max-width:860px){.layout{grid-template-columns:1fr}aside{position:static}.card{grid-template-columns:64px 1fr}.logo{width:64px;height:64px}.side{grid-column:1/-1;text-align:left}}
</style></head><body>
<header class="head"><div class="in"><nav><b>Course Compass</b><a href="#">Saved (0)</a></nav><h1>Find the right college for your course</h1><p>Compare 1,200 colleges by city, subject and yearly fees.</p></div></header>
<div class="search"><div><input id="q" type="search" placeholder="Search by college or subject, for example nursing" aria-label="Search colleges"></div></div>
<div class="layout"><aside aria-label="Filters"><h2>City</h2><div id="cities"></div><h2>Subject</h2><div id="subs"></div><h2>Max fees per year</h2><input type="range" id="fee" min="2000" max="9000" step="500" value="9000" aria-describedby="feev"><p id="feev">Up to $9,000</p><label style="margin-top:10px"><input type="checkbox" id="open"> Taking applications now</label><button class="reset" id="reset">Clear all filters</button></aside>
<main><div class="top"><p id="cnt" aria-live="polite"></p><label>Sort <select id="sort"><option value="name">Name</option><option value="lo">Fees, low to high</option><option value="hi">Fees, high to low</option></select></label></div><div id="list"></div></main></div>
<p class="credit">Free template from <a href="https://mmrahmanbappi.github.io/100-css-designs/">100 CSS Designs</a></p>
<script>
const C=[['Riverside College of Nursing','Manchester','Health',6800,true,'#2f6fed'],['Northgate Technical College','Leeds','Engineering',5200,true,'#e0621f'],['Harbor School of Hospitality','Bristol','Hospitality',4600,false,'#16835a'],['Midland Institute of Design','Birmingham','Design',7400,true,'#8a4fd8'],['Westbrook College of Business','Manchester','Business',3900,true,'#d94f7a'],['Pennine Engineering Academy','Leeds','Engineering',6100,false,'#0f8b9c'],['Clifton Health Sciences','Bristol','Health',8200,true,'#c0392b'],['Canal Street Culinary School','Birmingham','Hospitality',3400,true,'#b7791f']];
const cities=[...new Set(C.map(c=>c[1]))],subs=[...new Set(C.map(c=>c[2]))];
const mk=(id,arr)=>document.getElementById(id).innerHTML=arr.map(v=>'<label><input type="checkbox" value="'+v+'"> '+v+'</label>').join('');mk('cities',cities);mk('subs',subs);
const q=document.getElementById('q'),fee=document.getElementById('fee'),open=document.getElementById('open'),sort=document.getElementById('sort'),list=document.getElementById('list');
function chk(id){return [...document.querySelectorAll('#'+id+' input:checked')].map(i=>i.value)}
function render(){const t=q.value.toLowerCase(),cs=chk('cities'),ss=chk('subs'),mx=+fee.value;document.getElementById('feev').textContent='Up to $'+mx.toLocaleString();
let L=C.filter(c=>(!t||(c[0]+' '+c[2]).toLowerCase().includes(t))&&(!cs.length||cs.includes(c[1]))&&(!ss.length||ss.includes(c[2]))&&c[3]<=mx&&(!open.checked||c[4]));
if(sort.value==='name')L.sort((a,b)=>a[0].localeCompare(b[0]));if(sort.value==='lo')L.sort((a,b)=>a[3]-b[3]);if(sort.value==='hi')L.sort((a,b)=>b[3]-a[3]);
document.getElementById('cnt').textContent=L.length+(L.length===1?' college':' colleges')+' found';
list.innerHTML=L.length?L.map(c=>'<article class="card"><span class="logo" style="--c:'+c[5]+'" aria-hidden="true">'+c[0].split(' ').slice(0,2).map(w=>w[0]).join('')+'</span><div><h3>'+c[0]+'</h3><p class="loc">'+c[1]+'</p><div class="tags"><span>'+c[2]+'</span>'+(c[4]?'<span class="open">Applications open</span>':'<span>Opens in March</span>')+'</div></div><div class="side"><b>$'+c[3].toLocaleString()+'</b><small>per year</small><br><a href="#">View college</a></div></article>').join(''):'<div class="empty">No colleges match these filters. Try clearing one or two.</div>'}
[q,fee,open,sort].forEach(el=>el.addEventListener('input',render));document.querySelectorAll('aside input[type=checkbox]').forEach(i=>i.addEventListener('change',render));
document.getElementById('reset').onclick=()=>{document.querySelectorAll('aside input[type=checkbox]').forEach(i=>i.checked=false);fee.value=9000;q.value='';render()};render();
</script>
</body></html>
