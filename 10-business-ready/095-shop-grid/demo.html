<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop and Knot Knitwear | Product Grid Shop HTML Template</title>
<meta name="description" content="Free e-commerce product grid template for a knitwear shop. Working category filters, sort by price, color swatches and an add to basket counter. One HTML file.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--ink:#1f1b16;--muted:#6f675c;--line:#e7e0d4;--acc:#a14b2c}
*{box-sizing:border-box;margin:0}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.w{max-width:1200px;margin:0 auto;padding:0 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
header b{font-family:"DM Serif Display",serif;font-size:1.6rem;font-weight:400}
.bag{font:inherit;font-weight:600;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:9px 16px}
.bag span{display:inline-block;min-width:20px;background:#fff;color:var(--ink);border-radius:999px;margin-left:6px;text-align:center}
.bag.bump span{animation:bump .35s}@keyframes bump{50%{transform:scale(1.4)}}
@media(prefers-reduced-motion:reduce){.bag.bump span{animation:none}}
h1{font-family:"DM Serif Display",serif;font-weight:400;font-size:clamp(2rem,5vw,3rem);margin:30px 0 6px}
.sub{color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:22px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--ink)}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.count{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding-bottom:60px}
.pr{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.pr .ph{aspect-ratio:4/5;background:var(--c);display:grid;place-items:center;position:relative}
.pr .ph i{width:62%;height:62%;background:rgba(255,255,255,.28);clip-path:polygon(28% 0,72% 0,100% 18%,90% 40%,80% 36%,80% 100%,20% 100%,20% 36%,10% 40%,0 18%);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 3px,transparent 3px 8px)}
.pr .ph em{position:absolute;left:10px;top:10px;font-style:normal;font-size:.78rem;font-weight:600;background:#fff;padding:2px 8px;border-radius:999px}
.pr .in{padding:14px}
.pr h2{font-size:1rem;font-weight:600}
.pr .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.sw{display:flex;gap:5px}.sw i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.add{font:inherit;font-size:.9rem;font-weight:600;border:1px solid var(--ink);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;margin-top:10px;width:100%;color:var(--ink)}
.add:hover{background:var(--ink);color:#fff}
.add.ok{background:var(--acc);border-color:var(--acc);color:#fff}
.credit{text-align:center;padding:0 0 30px;color:var(--muted);font-size:.9rem}.credit a{color:var(--ink)}
@media(max-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="w">
<header><b>Loop and Knot</b><button class="bag" id="bag" aria-live="polite">Basket<span id="n">0</span></button></header>
<main><h1>Winter knits</h1><p class="sub">Merino and alpaca, knitted in small batches in Donegal.</p>
<div class="bar"><div class="chips" role="group" aria-label="Filter by category"><button aria-pressed="true" data-c="all">All</button><button aria-pressed="false" data-c="jumper">Jumpers</button><button aria-pressed="false" data-c="cardigan">Cardigans</button><button aria-pressed="false" data-c="hat">Hats and scarves</button></div>
<label>Sort <select id="sort"><option value="new">Newest</option><option value="lo">Price, low to high</option><option value="hi">Price, high to low</option></select></label></div>
<p class="count" id="cnt"></p><section class="grid" id="grid" aria-label="Products"></section></main></div>
<p class="credit">Free template from <a href="https://mmrahmanbappi.github.io/100-css-designs/">100 CSS Designs</a></p>
<script>
const P=[['Fisherman jumper','jumper',145,'#d8cbb3',['#d8cbb3','#3b4a5a'],'Bestseller'],['Moss cardigan','cardigan',160,'#7d8b62',['#7d8b62','#c9b79c']],['Alpaca beanie','hat',42,'#b5553a',['#b5553a','#2f3a4a','#e7dcc8'],'New'],['Crew neck merino','jumper',110,'#2f3a4a',['#2f3a4a','#9aa7b5']],['Chunky scarf','hat',58,'#c9b79c',['#c9b79c','#8a3b2c']],['Long line cardigan','cardigan',185,'#8a3b2c',['#8a3b2c','#d8cbb3'],'New'],['Roll neck jumper','jumper',130,'#e7dcc8',['#e7dcc8','#1f1b16']],['Cable mittens','hat',36,'#9aa7b5',['#9aa7b5','#b5553a']]];
let cat='all',sort='new',n=0;const g=document.getElementById('grid');
function render(){let L=P.map((p,i)=>({p,i})).filter(o=>cat==='all'||o.p[1]===cat);if(sort==='lo')L.sort((a,b)=>a.p[2]-b.p[2]);if(sort==='hi')L.sort((a,b)=>b.p[2]-a.p[2]);
document.getElementById('cnt').textContent=L.length+' products';
g.innerHTML=L.map(({p})=>'<article class="pr"><div class="ph" style="--c:'+p[3]+'"><i></i>'+(p[5]?'<em>'+p[5]+'</em>':'')+'</div><div class="in"><h2>'+p[0]+'</h2><div class="row"><span>€'+p[2]+'</span><span class="sw" aria-label="'+p[4].length+' colors">'+p[4].map(c=>'<i style="background:'+c+'"></i>').join('')+'</span></div><button class="add">Add to basket</button></div></article>').join('');
g.querySelectorAll('.add').forEach(b=>b.onclick=()=>{n++;document.getElementById('n').textContent=n;const bg=document.getElementById('bag');bg.classList.remove('bump');void bg.offsetWidth;bg.classList.add('bump');b.textContent='Added';b.classList.add('ok');setTimeout(()=>{b.textContent='Add to basket';b.classList.remove('ok')},1400)})}
document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;document.querySelectorAll('.chips button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
document.getElementById('sort').onchange=e=>{sort=e.target.value;render()};render();
</script>
</body></html>
